<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Studio admin — Opinatii Photography</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/cms/studio.css" />
    <script type="module" src="/cms/admin.js"></script>
  </head>
  <body class="studio">
    <header class="studio-head">
      <img
        class="brand-logo"
        src="/assets/opinatii-logo.png"
        alt="Opinatii Photography"
      />
      <nav id="admin-nav" aria-label="Administration" hidden></nav>
    </header>
    <main class="studio-main" id="studio" aria-busy="true">
      Loading studio…
    </main>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="editor"></dialog>
  </body>
</html>
